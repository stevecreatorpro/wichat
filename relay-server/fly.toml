# Fly.io config. Deploy with:  fly launch --copy-config --no-deploy && fly volumes create wichat_data --size 3 && fly deploy
# Change `app` to a unique name; your relay URL becomes https://<app>.fly.dev
app = "wichat-relay"
primary_region = "jnb"

[build]

[mounts]
  source = "wichat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so WebSockets stay connected and messages arrive instantly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
